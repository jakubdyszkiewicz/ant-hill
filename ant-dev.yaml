---
- hosts: ant-dev
  vars_files:
    - vars/secrets.yaml
  tasks:
    - name: Allocate swap file
      become: true
      ansible.builtin.command:
        argv: [fallocate, -l, 16G, /swapfile]
        creates: /swapfile
      register: ant_dev_swap_created
    - name: Set swap file permissions
      become: true
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: '0600'
    - name: Initialize new swap file
      become: true
      ansible.builtin.command:
        argv: [mkswap, /swapfile]
      when: ant_dev_swap_created.changed
    - name: Persist swap mount
      become: true
      ansible.posix.mount:
        src: /swapfile
        path: none
        fstype: swap
        opts: sw
        state: present
    - name: Read active swap files
      become: true
      ansible.builtin.command:
        argv: [swapon, --show=NAME, --noheadings, --raw] # --show takes the columns; --output is ignored
      register: ant_dev_active_swap
      changed_when: false
    - name: Activate swap file
      become: true
      ansible.builtin.command:
        argv: [swapon, /swapfile]
      when: "'/swapfile' not in ant_dev_active_swap.stdout_lines"
    - name: Configure swap preference
      become: true
      ansible.posix.sysctl:
        name: vm.swappiness
        value: '10'
        sysctl_file: /etc/sysctl.d/90-ant-dev-swap.conf
        sysctl_set: true
        state: present
        reload: true
    - name: Install mDNS Discovery
      become: yes
      apt:
        pkg:
          - avahi-daemon
        state: latest
        update_cache: true
        cache_valid_time: 86400 # One day
    - name: Install dotfiles
      include_role:
        name: dotfiles
      vars:
        dotfiles_mise_envs: linux,dev # dev tools (go, node, java, rust, cmake, opencode, claude-code, codex) from dotfishy's mise/config.dev.toml
    - name: Enable IPv4 forwarding for exit node
      become: true
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: yes
    - name: Enable IPv6 forwarding for exit node
      become: true
      ansible.posix.sysctl:
        name: net.ipv6.conf.all.forwarding
        value: "1"
        state: present
        reload: yes
    - name: Install VPN (tailscale) as exit node
      vars:
        tailscale_args: "--advertise-exit-node"
      ansible.builtin.include_role:
        name: artis3n.tailscale.machine
