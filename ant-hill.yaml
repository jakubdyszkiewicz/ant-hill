---
- hosts: ant-hill

  vars:
    ssh_authorized_keys: # written into new VMs by cloud-init
    - "{{ lookup('file', 'files/ssh/jakub-macbook.pub') }}"
  vars_files:
  - vars/secrets.yaml

  tasks:
  - name: Install packages
    become: yes
    apt:
      pkg:
      - avahi-daemon # mDNS Discovery: ant-hill.local, ant-dev.local, ant-services.local
      - cockpit
      - cockpit-machines
      - libvirt-daemon-system
      - python3-lxml
      state: latest
      update_cache: true
      cache_valid_time: 86400 # One day
  - name: adding existing user '{{ ansible_user }}' to group libvirt
    user:
      name: "{{ ansible_user }}"
      groups: libvirt,kvm
      append: yes
    become: yes
  - name: Enable and start cockpit service
    ansible.builtin.systemd:
      name: cockpit.socket
      state: started
      enabled: true
  - name: Install dotfiles
    include_role:
      name: dotfiles
  - name: Install VPN (tailscale) # auth key is encrypted in vars/secrets.yaml
    include_role:
      name: artis3n.tailscale.machine
  - name: Decrypt backup volume
    become: true
    community.crypto.luks_device:
      device: /dev/disk/by-id/ata-CT1000MX500SSD1_2144E5E0D596
      state: opened
      name: backup
      passphrase: "{{ luks_volumes_passphrase }}"
  - name: Copy networking configuration
    copy:
      src: '02-ant-hill-networking.yaml'
      dest: "/etc/netplan/02-ant-hill-networking.yaml"
      mode: '0644'
    become: true
  - name: Apply network configuration
    shell: netplan apply
    become: true
  - name: Restart networking service
    become: true
    service:
      name: systemd-networkd
      state: restarted
  - name: Provision ant-dev VM
    include_role:
      name: vm_provision
    vars:
      base_image_name: noble-server-cloudimg-amd64.img
      base_image_url: "https://cloud-images.ubuntu.com/noble/20251213/{{ base_image_name }}"
      base_image_sha: 2b5f90ffe8180def601c021c874e55d8303e8bcbfc66fee2b94414f43ac5eb1f
      vm_name: 'ant-dev'
      vm_net_mac: '52:54:00:ef:39:12'
      vm_net_ip: '192.168.1.51'
      vm_vcpus: 14
      vm_ram_mb: 16384
      vm_swap_size: 16G
      vm_disk_size: 500G
  - name: Provision ant-services VM
    include_role:
      name: vm_provision
    vars:
      base_image_name: noble-server-cloudimg-amd64.img
      base_image_url: "https://cloud-images.ubuntu.com/noble/20251213/{{ base_image_name }}"
      base_image_sha: 2b5f90ffe8180def601c021c874e55d8303e8bcbfc66fee2b94414f43ac5eb1f
      vm_name: 'ant-services'
      vm_net_mac: '52:54:00:ef:39:13'
      vm_net_ip: '192.168.1.52'
      vm_vcpus: 8
      vm_ram_mb: 12288
      vm_swap_size: 4G
      vm_disk_size: 250G
      usb_mappings:
      - source_vendor: "0x1a86" # Zigbee Dongle
        source_product: "0x55d4"
      disk_mappings:
      - source_dev: /dev/disk/by-label/media
        target_dev: vdc
      - source_dev: /dev/mapper/backup # the new data
        target_dev: vdd
