---
- hosts: ant-services
  vars_files:
  - vars/secrets.yaml
  pre_tasks:
  - name: Validate dedicated observability API key
    ansible.builtin.assert:
      that:
      - kong_observability_api_key is string
      - kong_observability_api_key | trim | length > 0
      - kong_observability_api_key != kong_api_key
      fail_msg: "kong_observability_api_key must be a non-empty dedicated key, different from kong_api_key."
    no_log: true
  tasks:
  - name: Install mDNS Discovery
    become: yes
    apt:
      pkg:
      - avahi-daemon
      state: latest
      update_cache: true
      cache_valid_time: 86400 # One day
  # Track extra modules across kernel upgrades and cover the running kernel too.
  # The Zigbee dongle needs cdc_acm, which is absent from linux-virtual alone.
  - name: Install extra modules for current and future kernels
    become: yes
    apt:
      pkg:
      - linux-image-extra-virtual
      - "linux-modules-extra-{{ ansible_kernel }}"
      state: latest
      update_cache: true
      cache_valid_time: 86400 # One day
  - name: Authorize CI deploy key (Tailscale source addresses only)
    ansible.posix.authorized_key:
      user: "{{ ansible_user }}"
      key: "{{ lookup('file', 'files/ci-deploy.pub') }}"
      key_options: 'from="100.64.0.0/10"'
  - name: Install dotfiles
    include_role:
      name: dotfiles
  - name: Install VPN (tailscale) # auth key is encrypted in vars/secrets.yaml
    include_role:
      name: artis3n.tailscale.machine
  - name: Install docker
    become: yes
    apt:
      pkg:
      - docker.io
      state: latest
      update_cache: true
      cache_valid_time: 86400 # One day
  # With nofail in fstab, local-fs.target no longer waits for the data disks. Docker must,
  # or containers would start on empty directories on the root disk.
  - name: Docker drop-in directory
    become: yes
    ansible.builtin.file:
      path: /etc/systemd/system/docker.service.d
      state: directory
      mode: "0755"
  - name: Make Docker wait for the data disks
    become: yes
    ansible.builtin.copy:
      dest: /etc/systemd/system/docker.service.d/10-require-mounts.conf
      content: |
        [Unit]
        RequiresMountsFor=/mnt/data /mnt/media
      mode: "0644"
    register: docker_mounts_dropin
  - name: Reload systemd for the Docker drop-in # takes effect at the next start; no restart now
    become: yes
    ansible.builtin.systemd_service:
      daemon_reload: true
    when: docker_mounts_dropin.changed
  - name: Remove Compose v1 # replaced by the Compose plugin below
    become: yes
    apt:
      pkg: docker-compose
      state: absent
  - name: Ensure cli-plugins dir exists (system-wide)
    become: yes
    file:
      path: /usr/local/lib/docker/cli-plugins
      state: directory
      mode: "0755"
  - name: Install Docker Compose plugin binary
    become: yes
    get_url:
      url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-x86_64"
      dest: /usr/local/lib/docker/cli-plugins/docker-compose
      mode: "0755"
      # get_url verifies against the release's own checksums.txt, so a version bump is the only edit.
      checksum: "sha256:https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/checksums.txt"
    vars:
      docker_compose_version: v5.8.0 # renovate: datasource=github-releases depName=docker/compose
  - name: adding existing user '{{ ansible_user }}' to group docker
    user:
      name: "{{ ansible_user }}"
      groups: docker
      append: yes
    become: yes
  # Private images (bubblewrap, kroczek, sure-patched, ...) live on ghcr.io. The deploy pulls
  # as root (docker compose with become); log in ubuntu too for manual pulls.
  # Token: classic PAT with read:packages only, in the vault.
  - name: Log in to ghcr.io (root)
    become: yes
    ansible.builtin.command:
      cmd: docker login ghcr.io --username jakubdyszkiewicz --password-stdin
      stdin: "{{ ghcr_read_token }}"
    changed_when: false
    no_log: true
  - name: Log in to ghcr.io ({{ ansible_user }})
    ansible.builtin.command:
      cmd: docker login ghcr.io --username jakubdyszkiewicz --password-stdin
      stdin: "{{ ghcr_read_token }}"
    changed_when: false
    no_log: true
  # --- Volumes ---
  - name: Mount media directory exists
    become: true
    ansible.builtin.file:
      path: "/mnt/media"
      state: directory
      mode: '0755'
      owner: "{{ ansible_user }}"
  - name: Mount media volume
    become: true
    ansible.posix.mount:
      src: "UUID=dfac02bd-ac6d-4450-8636-7429cbcd5651"
      path: "/mnt/media"
      boot: true
      fstype: ext4
      # nofail: a missing disk doesn't stop boot (SSH and Tailscale still come up);
      # Docker waits for the mount instead (RequiresMountsFor drop-in).
      opts: defaults,nofail
      state: mounted
  - name: Mount data directory exists
    become: true
    ansible.builtin.file:
      path: "/mnt/data"
      state: directory
      mode: '0755'
      owner: "{{ ansible_user }}"
  - name: Mount data volume
    become: true
    ansible.posix.mount:
      src: "UUID=2ca0e49d-cf92-4b1d-9d6b-a2f8b38fa77a"
      path: "/mnt/data"
      boot: true
      fstype: ext4
      # nofail: a missing disk doesn't stop boot (SSH and Tailscale still come up);
      # Docker waits for the mount instead (RequiresMountsFor drop-in).
      opts: defaults,nofail
      state: mounted
  - name: Create docker-services directories
    ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      mode: '0755'
    loop:
      - "/home/{{ ansible_user }}/docker-services"
      - "/home/{{ ansible_user }}/docker-services/data"
      - "/home/{{ ansible_user }}/docker-services/data/prometheus"
      - "/home/{{ ansible_user }}/docker-services/data/grafana"
      - "/home/{{ ansible_user }}/docker-services/data/downloads"
      - "/mnt/data/services/terminus/fonts"
      - "/mnt/data/services/terminus/uploads"
  - name: Create Sure storage directory
    become: true
    ansible.builtin.file:
      path: "/mnt/data/services/sure/storage"
      state: directory
      mode: '0755'
      owner: '1000'
      group: '1000'
  - name: Create Tergeo data directory
    become: true
    ansible.builtin.file:
      path: "/mnt/data/services/tergeo"
      state: directory
      mode: '0755'
      # The Tergeo image runs as its Alpine system user (UID 100, GID 101).
      owner: '100'
      group: '101'
  - name: Create docker-services template directories
    ansible.builtin.file:
      path: "/home/{{ ansible_user }}/docker-services/{{ item.path }}"
      state: directory
      mode: '0755'
    with_community.general.filetree: templates/docker-services/
    when: item.state == 'directory'
  - name: Read docker socket group # telegraf runs as this group to read container state
    ansible.builtin.stat:
      path: /var/run/docker.sock
    register: docker_sock
  - name: Set docker socket gid
    ansible.builtin.set_fact:
      docker_sock_gid: "{{ docker_sock.stat.gid }}"
  - name: Template docker-services files
    ansible.builtin.template:
      src: '{{ item.src }}'
      # Your template files should be stored with a .j2 file extension,
      # but should not be deployed with it. splitext|first removes it.
      dest: "/home/{{ ansible_user }}/docker-services/{{ item.path | splitext | first }}"
      # Files with credentials. ddclient also tightens its config to 0600 itself.
      mode: "{{ '0600' if item.path in ['ddclient/ddclient.conf.j2', 'prometheus/healthchecks-targets.yml.j2'] else '0644' }}"
      # rclone rewrites its config with each refreshed OAuth token; the vault token only seeds it.
      force: "{{ item.path != 'rclone/rclone.conf.j2' }}"
    with_community.general.filetree: templates/docker-services/
    register: docker_templates
    when:
    - item.state == 'file'
    - item.path.endswith('.j2')
    - item.path != 'kong/kong.yml.j2'
  - name: Template Kong config
    ansible.builtin.template:
      src: templates/docker-services/kong/kong.yml.j2
      dest: "/home/{{ ansible_user }}/docker-services/kong/kong.yml"
      mode: '0644'
    register: kong_config
  - name: Copy docker-services files
    ansible.builtin.copy:
      src: '{{ item.src }}'
      dest: "/home/{{ ansible_user }}/docker-services/{{ item.path  }}"
      mode: '0644'
    with_community.general.filetree: templates/docker-services/
    when:
      - item.state == 'file'
      - item.path.endswith('.j2') == False
    register: docker_files
  - name: Run all services with docker compose
    become: yes
    community.docker.docker_compose_v2:
      project_src: "/home/{{ ansible_user }}/docker-services"
      state: present
      remove_orphans: true
  # --- mDNS between the LAN and the docker-services network ---
  # Home Assistant runs on the compose bridge network, and multicast doesn't cross
  # it. avahi on the host reflects mDNS both ways, so Apple Home finds the HomeKit
  # Bridge and HA discovers Cast/Apple TV/LG TV. Replaces the mdns-repeater container.
  - name: Find the docker-services bridge interface
    become: yes
    ansible.builtin.command: docker network inspect -f '{% raw %}{{.Id}}{% endraw %}' docker-services_default
    register: docker_services_network
    changed_when: false
    check_mode: false # read-only; needed for --check runs too
  - name: Reflect mDNS between the LAN and the docker-services bridge
    become: yes
    community.general.ini_file:
      path: /etc/avahi/avahi-daemon.conf
      section: "{{ item.section }}"
      option: "{{ item.option }}"
      value: "{{ item.value }}"
      no_extra_spaces: true
    loop:
      - { section: server, option: allow-interfaces, value: "{{ ansible_facts['default_ipv4']['interface'] }},br-{{ docker_services_network.stdout[:12] }}" }
      - { section: reflector, option: enable-reflector, value: "yes" }
    register: avahi_config
  - name: Restart avahi if its config changed
    become: yes
    ansible.builtin.systemd_service:
      name: avahi-daemon
      state: restarted
    when: avahi_config.changed
  # --- Nightly backup prep: database dumps before the 02:00 Duplicacy backup ---
  - name: Install backup prep script
    become: yes
    ansible.builtin.copy:
      src: files/backup-prep/ant-backup-prep.sh
      dest: /usr/local/bin/ant-backup-prep
      mode: '0755'
  - name: Install backup prep systemd units
    become: yes
    ansible.builtin.copy:
      src: "files/backup-prep/{{ item }}"
      dest: "/etc/systemd/system/{{ item }}"
      mode: '0644'
    loop:
      - ant-backup-prep.service
      - ant-backup-prep.timer
    register: backup_prep_units
  - name: Directory for node-exporter textfile metrics (backup prep status)
    become: yes
    ansible.builtin.file:
      path: /var/lib/node_exporter/textfile
      state: directory
      mode: '0755'
  - name: Enable the nightly backup prep timer
    become: yes
    ansible.builtin.systemd_service:
      name: ant-backup-prep.timer
      enabled: true
      state: started
      daemon_reload: "{{ backup_prep_units.changed }}"
  - name: Restart Kong if config changed
    become: yes
    community.docker.docker_compose_v2:
      project_src: "/home/{{ ansible_user }}/docker-services"
      services:
        - kong
      state: restarted
    when: kong_config.changed
  # These read their config only at startup (Grafana: alert rules, contact points, datasources).
  - name: Restart services whose config files changed
    become: yes
    community.docker.docker_compose_v2:
      project_src: "/home/{{ ansible_user }}/docker-services"
      services:
        - "{{ item }}"
      state: restarted
    loop: [grafana, prometheus, blackbox-exporter]
    when: >-
      (docker_templates.results + docker_files.results)
      | selectattr('changed', 'defined') | selectattr('changed')
      | map(attribute='item.path') | select('match', item ~ '/') | list | length > 0
