---
# Go, build-essential, Docker and its Compose v2 plugin come from dotfishy's
# mise/config.dev.toml, see the dotfiles role.
- name: Install dependencies for Kuma
  become: yes
  apt:
    pkg:
    - git
    - unzip
    - make
    - clang-format
    - unzip
    state: latest
    update_cache: true
    cache_valid_time: 86400 # One day
- name: Remove Compose v1 # the Python docker-compose; `docker compose` comes from dotfishy
  become: yes
  apt:
    pkg: docker-compose
    state: absent
- name: Creates kong working dir
  file:
    path: ~/kong
    state: directory
