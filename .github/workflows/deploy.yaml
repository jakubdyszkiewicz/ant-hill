name: Deploy ant-services

on:
  push:
    branches: [master]
    paths:
      - templates/docker-services/**
      - ant-services.yaml
      - vars/**
      - roles/dotfiles/**
      - files/ci-deploy.pub
      - requirements.yaml
      - services.sh
      - ci/**
      - .github/workflows/deploy.yaml
  workflow_dispatch:

concurrency:
  group: deploy-ant-services
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ant-services
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token for Tailscale workload identity federation
    steps:
      - uses: actions/checkout@v4
      # Install before joining the tailnet to save ephemeral node minutes.
      - name: Install Ansible
        run: |
          pipx install ansible-core==2.21.5
          ansible-galaxy install -r requirements.yaml
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp ci/ssh_known_hosts ~/.ssh/known_hosts
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
      - name: Run playbook
        run: ./services.sh
        env:
          INVENTORY: ci/inventory
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
