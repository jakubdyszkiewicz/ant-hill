name: Deploy ant-services

on:
  push:
    branches: [master]
    paths:
      - templates/docker-services/**
      - ant-services.yaml
      - ansible.cfg
      - vars/**
      - roles/dotfiles/**
      - files/ci-deploy.pub
      - files/db-dumps/**
      - requirements.yaml
      - services.sh
      - ci/**
      - .github/workflows/deploy.yaml
  workflow_dispatch:

concurrency:
  group: deploy-ant-services
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ant-services
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token for Tailscale workload identity federation
    steps:
      - uses: actions/checkout@v7
      # Install before joining the tailnet to save ephemeral node minutes.
      - name: Install Ansible
        run: |
          pipx install ansible-core==2.21.5
          ansible-galaxy install -r requirements.yaml
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp ci/ssh_known_hosts ~/.ssh/known_hosts
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
      # Logs of a public repo are public. Keep the full Ansible output (which may
      # contain rendered secrets on failure) on ant-services; print only task
      # names of failures and the recap here.
      - name: Run playbook
        run: |
          status=0
          ./services.sh > deploy.log 2>&1 || status=$?
          awk '/^TASK \[/ { task = $0 } /^(fatal|failed):/ { print "FAILED " task }' deploy.log
          sed -n '/^PLAY RECAP/,$p' deploy.log
          echo "Full log: ~/deploy-logs/${{ github.run_id }}.log on ant-services"
          exit $status
        env:
          INVENTORY: ci/inventory
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
          # Equivalent of -v --diff. Safe only because the output goes to deploy.log.
          ANSIBLE_VERBOSITY: "1"
          ANSIBLE_DIFF_ALWAYS: "true"
      - name: Store log on ant-services
        if: always() && hashFiles('deploy.log') != ''
        run: |
          ssh ubuntu@100.85.253.43 'mkdir -p -m 700 ~/deploy-logs && find ~/deploy-logs -name "*.log" -mtime +90 -delete'
          scp deploy.log "ubuntu@100.85.253.43:deploy-logs/${{ github.run_id }}.log"
