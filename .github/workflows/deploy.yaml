name: Deploy ant-services

on:
  push:
    branches: [master]
    paths:
      - templates/docker-services/**
      - ant-services.yaml
      - ansible.cfg
      - vars/**
      - roles/dotfiles/**
      - roles/docker/**
      - files/ssh/**
      - files/backup-prep/**
      - files/reboot-required/**
      - files/apt/**
      - requirements.yaml
      - services.sh
      - ci/**
      - .github/workflows/deploy.yaml
      - .github/workflows/ansible-deploy.yaml
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/ansible-deploy.yaml
    with:
      host: ant-services
      script: ./services.sh
      ssh_target: ubuntu@100.85.253.43
    secrets: inherit
