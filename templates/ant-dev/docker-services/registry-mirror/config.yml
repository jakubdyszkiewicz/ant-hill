version: 0.1
log:
  level: info
  fields:
    service: registry-mirror
storage:
  # Required for proxy mode: expired cache entries are removed after proxy.ttl.
  delete:
    enabled: true
  cache:
    blobdescriptor: inmemory
  filesystem:
    rootdirectory: /var/lib/registry
http:
  # Host networking: reachable from isodev containers via their network gateway.
  addr: 0.0.0.0:5000
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
proxy:
  remoteurl: https://registry-1.docker.io
  ttl: 168h
