# Container state and health for Prometheus: restarts, health, exit codes,
# OOM kills. Resource usage stays with cAdvisor.
[agent]
  interval = "15s"
  omit_hostname = true
  skip_processors_after_aggregators = true

[[inputs.docker]]
  endpoint = "tcp://docker-socket-proxy:2375" # read-only proxy, not the raw socket
  # Include stopped and restarting containers too: that's the point.
  container_state_include = ["created", "restarting", "running", "removing", "paused", "exited", "dead"]
  # Skip per-device/total resource metrics; cAdvisor covers those.
  perdevice_include = []
  total_include = []
  # Compose adds many labels per container; don't turn them into Prometheus labels.
  docker_label_exclude = ["*"]
  namepass = ["docker_container_status", "docker_container_health"]
  fieldinclude = ["restart_count", "exitcode", "oomkilled", "started_at", "failing_streak", "health_status"]
  # container_id changes on every recreate; image/version are mangled by @sha256 pins.
  tagexclude = ["container_id", "container_image", "container_version", "engine_host", "server_version"]

# Prometheus can't store string fields: make health_status a label instead.
[[processors.converter]]
  [processors.converter.fields]
    tag = ["health_status"]

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  collectors_exclude = ["gocollector", "process"]
  # Drop series of removed containers.
  expiration_interval = "60s"
