global:
  scrape_interval:     15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: 'nodeexporter'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          host: 'ant-services'
  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          host: 'ant-services'
  - job_name: 'telegraf'
    scrape_interval: 15s
    static_configs:
      - targets: ['telegraf:9273']
        labels:
          host: 'ant-services'
  - job_name: 'speedtest-exporter'
    scrape_interval: 1h
    scrape_timeout: 1m
    static_configs:
      - targets: ['speedtest:9090']
  - job_name: 'ant-sensors'
    scrape_interval: 10s
    static_configs:
      - targets: ['192.168.1.50:9255']
  - job_name: 'nodeexporter-ant-dev'
    scrape_interval: 10s
    static_configs:
      - targets: ['192.168.1.51:9100']
        labels:
          host: 'ant-dev'
