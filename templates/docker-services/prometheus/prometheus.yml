global:
  scrape_interval:     15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: 'nodeexporter'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          host: 'ant-services'
  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          host: 'ant-services'
  - job_name: 'telegraf'
    scrape_interval: 15s
    static_configs:
      - targets: ['telegraf:9273']
        labels:
          host: 'ant-services'
  - job_name: 'speedtest-exporter'
    scrape_interval: 1h
    scrape_timeout: 1m
    static_configs:
      - targets: ['speedtest:9090']
  - job_name: 'ant-sensors'
    scrape_interval: 10s
    static_configs:
      - targets: ['192.168.1.50:9255']
  - job_name: 'nodeexporter-ant-dev'
    scrape_interval: 10s
    static_configs:
      - targets: ['192.168.1.51:9100']
        labels:
          host: 'ant-dev'
  # Public hostnames through public DNS and Kong (targets rendered from kong.yml).
  - job_name: 'blackbox-exporter'
    scrape_interval: 1m
    metrics_path: /probe
    params:
      module: [kong_https]
    file_sd_configs:
      - files: ['/etc/prometheus/blackbox-targets.yml']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  # Heartbeat: each probe pings healthchecks.io, which alerts when pings stop
  # (server, internet, Prometheus or blackbox-exporter down). The URL is in the vault.
  - job_name: 'healthchecks'
    scrape_interval: 1m
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ['/etc/prometheus/healthchecks-targets.yml']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      # Keep the ping URL out of stored labels: anyone with it can fake a heartbeat.
      - target_label: instance
        replacement: healthchecks.io
      - target_label: __address__
        replacement: blackbox-exporter:9115
