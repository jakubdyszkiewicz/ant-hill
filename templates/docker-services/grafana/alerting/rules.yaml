# Grafana alert rules. Not a Jinja template: {{ }} below is Grafana's templating.
# Container metrics come from Telegraf (docker_container_*), Kong logs from Loki.
apiVersion: 1
groups:
  - orgId: 1
    name: containers
    folder: Alerts
    interval: 1m
    rules:
      - uid: container-restarting
        title: Container restarting
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: PBFA97CFB590B2093 # Prometheus
            model:
              refId: A
              instant: true
              # Docker restarts (crash loops). Deploys recreate containers, which resets
              # the counter instead of increasing it, so they don't trigger this.
              # After a reboot the Docker daemon starts containers in any order (depends_on only
              # applies to "docker compose up"), so apps that beat their database restart a few
              # times; ignore the first 15 min after boot. "unless" keeps the alert working
              # if node-exporter (boot time) is down.
              expr: 'max by (container_name) (increase(docker_container_status_restart_count[15m])) unless on() (time() - max(node_boot_time_seconds{host="ant-services"}) < 900)'
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0.5] } }] }
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.container_name }} restarted {{ printf "%.0f" $values.A.Value }} time(s) in the last 15 minutes'
      - uid: container-unhealthy
        title: Container unhealthy
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              instant: true
              expr: max by (container_name) (docker_container_health_failing_streak{health_status="unhealthy"})
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.container_name }} is unhealthy ({{ printf "%.0f" $values.A.Value }} failed healthchecks in a row)'
      - uid: container-exited-error
        title: Container exited with error
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              instant: true
              # One-off jobs that exit 0 (terminus-init-certificates) don't count.
              expr: max by (container_name) (docker_container_status_exitcode{container_status=~"exited|dead"})
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: '{{ $labels.container_name }} stopped with exit code {{ printf "%.0f" $values.A.Value }}'
      - uid: container-oom-killed
        title: Container OOM-killed
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              instant: true
              # Docker clears the flag when the container starts again, so look back 15m.
              expr: max by (container_name) (max_over_time(docker_container_status_oomkilled[15m]))
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: '{{ $labels.container_name }} was killed for running out of memory'
  - orgId: 1
    name: kong
    folder: Alerts
    interval: 1m
    rules:
      - uid: kong-upstream-errors
        title: Kong upstream errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: P8E80F9AEF21F6940 # Loki
            model:
              refId: A
              queryType: instant
              # Kong can't reach the service behind a hostname (502 for users), e.g. stale DNS after a deploy.
              expr: 'sum by (host) (count_over_time({container_name="kong"} |~ "connect\\(\\) failed|upstream timed out|no live upstreams" | regexp "host: \"(?P<host>[^\"]+)\"" [5m]))'
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [10] } }] }
        # Longer than the 5m window plus a burst, so errors while a deploy restarts a service age out
        # before firing (5m raced: a burst during Grafana's restart cleared only at the last second).
        for: 7m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'Kong cannot reach the upstream for {{ $labels.host }} ({{ printf "%.0f" $values.A.Value }} errors in 5 minutes)'
  - orgId: 1
    name: disks
    folder: Alerts
    interval: 1m
    rules:
      - uid: disk-space-low
        title: Disk space low
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093 # Prometheus
            model:
              refId: A
              instant: true
              # Covers every filesystem node-exporter reports on both hosts, including the 1 GB /boot.
              expr: 'min by (host, mountpoint) (100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"})'
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: lt, params: [10] } }] }
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: '{{ $labels.mountpoint }} on {{ $labels.host }} has {{ printf "%.1f" $values.A.Value }}% free'
      - uid: disk-filling-up
        title: Disk filling up
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              instant: true
              # Days until full at the last 24h's rate, only for filesystems under 30% free:
              # a big download that lands and then moves to /mnt/media shouldn't page.
              expr: 'min by (host, mountpoint) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}) / -min by (host, mountpoint) (deriv(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}[24h])) / 86400 > 0 and min by (host, mountpoint) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs"}) < 0.3'
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: lt, params: [4] } }] }
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.mountpoint }} on {{ $labels.host }} will be full in about {{ printf "%.1f" $values.A.Value }} days at the current rate'
      - uid: disk-read-only
        title: Filesystem read-only
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              instant: true
              # ext4 remounts read-only on disk errors; every write then fails.
              expr: 'max by (host, mountpoint) (node_filesystem_readonly{fstype!~"tmpfs|overlay|squashfs|ramfs"})'
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: '{{ $labels.mountpoint }} on {{ $labels.host }} is mounted read-only (disk errors?)'
      - uid: data-volume-not-mounted
        title: Data volume not mounted
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              instant: true
              # If a volume isn't mounted, services write into the empty directory on / instead.
              expr: 'absent(node_filesystem_size_bytes{host="ant-services", mountpoint="/mnt/data"}) or absent(node_filesystem_size_bytes{host="ant-services", mountpoint="/mnt/media"})'
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: '{{ $labels.mountpoint }} is not mounted on {{ $labels.host }}'
  - orgId: 1
    name: probes
    folder: Alerts
    interval: 1m
    rules:
      - uid: public-endpoint-down
        title: Public endpoint down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093 # Prometheus
            model:
              refId: A
              instant: true
              # Blackbox requests every Kong hostname through public DNS. A failure means DNS
              # points elsewhere (ddclient), the port forward or Kong is broken, or TLS is invalid.
              expr: 'min by (instance) (probe_success{job="blackbox-exporter"})'
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: lt, params: [1] } }] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: '{{ $labels.instance }} is unreachable through public DNS and Kong'
      - uid: tls-certificate-expiring
        title: TLS certificate expiring
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              instant: true
              # One wildcard certificate serves every hostname. SWAG renews at 30 days left,
              # so under 14 means renewal has been failing for two weeks.
              expr: 'min((probe_ssl_earliest_cert_expiry{job="blackbox-exporter"} - time()) / 86400)'
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: lt, params: [14] } }] }
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'The TLS certificate served by Kong expires in {{ printf "%.0f" $values.A.Value }} days; check SWAG renewal'
      - uid: probes-missing
        title: Public endpoint probes missing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              instant: true
              # The rules above stay silent if blackbox-exporter is down or the target list is empty.
              expr: 'absent(probe_success{job="blackbox-exporter"})'
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'No blackbox probe results; check the blackbox-exporter container and prometheus/blackbox-targets.yml'
  - orgId: 1
    name: zigbee
    folder: Alerts
    interval: 1m
    rules:
      - uid: zigbee-adapter-out-of-buffers
        title: Zigbee adapter out of buffers
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: P8E80F9AEF21F6940 # Loki
            model:
              refId: A
              queryType: instant
              # The dongle refuses outgoing messages, so commands fail (a light that won't turn off)
              # until zigbee2mqtt is restarted. Started after the EmberZNet 7.4.4 reflash.
              expr: 'sum(count_over_time({container_name="zigbee2mqtt"} |~ "run out of buffers|MAX_MESSAGE_LIMIT_REACHED" [15m]))'
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [2] } }] }
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'The Zigbee adapter ran out of buffers {{ printf "%.0f" $values.A.Value }} times in 15 minutes; Zigbee commands may fail until zigbee2mqtt is restarted'
  - orgId: 1
    name: backups
    folder: Alerts
    interval: 5m
    rules:
      - uid: backup-prep-failed
        title: Backup prep job failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              instant: true
              # Written by /usr/local/bin/ant-backup-prep (systemd timer, 01:30 Europe/Warsaw).
              expr: min by (database) (ant_backup_success)
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: lt, params: [1] } }] }
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'Nightly backup prep for {{ $labels.database }} failed, so tonight''s B2 backup has no consistent copy of it'
      - uid: backup-prep-stale
        title: Backup prep job stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              instant: true
              expr: time() - max by (database) (ant_backup_last_run_timestamp_seconds)
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [93600] } }] }
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'No backup prep run for {{ $labels.database }} for {{ humanizeDuration $values.A.Value }} (expected nightly)'
  - orgId: 1
    name: host
    folder: Alerts
    interval: 5m
    rules:
      - uid: reboot-pending
        title: Reboot pending
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093 # Prometheus
            model:
              refId: A
              instant: true
              # Days since an update (kernel, libc, ...) asked for a reboot. Written hourly by
              # ant-reboot-required; the series only exists while a reboot is pending.
              expr: 'max by (packages) ((time() - ant_reboot_required_since_timestamp_seconds) / 86400)'
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [7] } }] }
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'ant-services has needed a reboot for {{ printf "%.0f" $values.A.Value }} days ({{ $labels.packages }}); updates are installed but not active until then. Remember to unlock Duplicacy afterwards if needed.'
